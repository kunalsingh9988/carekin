services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: carekin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: carekin
      POSTGRES_PASSWORD: carekin
      POSTGRES_DB: carekin
    ports:
      - "5432:5432"
    volumes:
      - carekin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carekin"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: carekin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - carekin-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  carekin-postgres-data:
  carekin-redis-data:
